[project]
name = "discord-read-only-mcp"
version = "0.1.0"
description = "Read recent messages from explicitly allowed Discord channels over MCP."
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.13,<1",
    "discord-py-self>=2,<3",
    "mcp>=1.12,<2",
    "pydantic>=2,<3",
]

[tool.uv]
package = false

[tool.mypy]
strict = true
files = ["server.py", "join_guild.py", "list_servers.py"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
]
